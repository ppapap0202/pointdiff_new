# Same as the pos8_compete8 run (exist_pos_radius 8, soft_compete 8/6) from the
# same epoch 0551 start, with rand_bg_topk added as the only difference.
# Diagnosis (logs/selector_diagnosis_epoch0560_0567.md): 68.4% of role=2
# "duplicates" were farther than the 6px eval radius and only got pressed to
# p50=0.140, versus p50=0.005 for real background. Those mislabelled points
# account for roughly 68% of far-background FPs.
# NOTE: rand_bg_ignore_radius is dead config here -- with
# exist_label_mode=nearest_gt_group the bg set comes from roles==0, so it is
# exist_pos_radius that controls both label assignment and L_rand_bg.
# Expect lambda_rand_bg*L_rand_bg to rise from ~0.24 to ~1.14 (3.2% of total loss).
