rand_count_slack: 0
# Rescaled to keep the background term's total magnitude comparable to the
# previous run. top-32 raises L_rand_bg from ~0.133 to ~0.6-0.7, so 10.0 would
# push its contribution from 1.33 to ~6.9 (23% of total loss) and dominate
# training. 2.0 lands near 1.2-1.4, matching the previous run: the only real
# change is which slots receive the gradient, not how strong the term is.
lambda_rand_bg: 2.0
rand_cover_t_min: 50
rand_cover_t_max: 50
rand_cover_radius: 3.0
rand_bg_ignore_radius: 32.0
# Hard negative mining for the background term. L_rand_bg used to be
# prob.mean() over every background slot, which dragged positives down
# with it: the selector cannot separate a near-GT slot from a background
# one a few px away (probe 4: same-group pro cosine 0.9866). The previous
# run (pos8 without this) lost recall 0.4118 -> 0.3641 and conf_no_nms_mae
# 109 -> 133.7 while precision only gained 0.03. Keeping the top-k highest
# scoring background slots presses only what is near or past the threshold.
# 0 restores the previous unweighted mean.
rand_bg_topk: 32

