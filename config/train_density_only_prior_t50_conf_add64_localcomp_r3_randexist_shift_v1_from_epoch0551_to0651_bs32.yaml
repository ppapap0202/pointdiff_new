# Experiment B: shift the existence-loss weight from the supervised branch to
# the random-start branch. exist_duplicate_weight stays at its 1.0 default, so
# Experiment A is fully reverted.
#
# lambda_exist drives criterion.forward, whose candidates come from
#   p_t = forward_noisy(p0, t~U[0,1000))          i.e. GT points plus noise.
# lambda_rand_exist drives the p2p_exist_loss call in train_loop, whose
# candidates come from
#   p_rand = forward_noisy(build_mixed_x0_prior(...), t=50) -> one denoise pass,
# which is what inference actually sees (DDIM from the prior at t=50).
#
# At low t the supervised branch puts candidates almost on top of the GT, so
# 'which one is closest' is well defined there and the head is rewarded for a
# judgement it cannot reproduce at inference time. Measured contributions were
# ~8.0 (supervised) versus ~0.78 (rand), a 10x imbalance favouring the branch
# that does not match deployment.
#
# 10.0 x ~0.20 = ~2.0 and 24.0 x ~0.098 = ~2.4, so total magnitude stays close
# to before while the centre of gravity moves to the inference distribution.
